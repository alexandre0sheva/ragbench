name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,anthropic,pdf,docx,hub]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  docs:
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: docs/systems.md, docs/cli.md, docs/tools.md and the README system table match the code
        run: python scripts/generate_docs.py --check
      - name: Links resolve, and nothing is documented twice
        run: python scripts/audit_docs.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.15 is best-effort until every dependency ships wheels for it (pyyaml has no 3.15 wheel yet).
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The SDK and loader extras are installed so the real-SDK provider tests and the PDF / Word loader tests run instead of skipping.
          python -m pip install -e ".[dev,anthropic,pdf,docx,hub]"
      - name: Fast tests (everything not marked `slow`, in parallel)
        if: matrix.python-version != '3.13'
        run: pytest -m "not slow" -n auto
      - name: Every test, with coverage (the floor is `fail_under` in pyproject.toml); the slow tests run here, on one version
        if: matrix.python-version == '3.13'
        run: pytest -n auto --cov --cov-report=term --cov-report=xml
      - name: Upload the coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  extras:
    name: Tests with every optional extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with the vector backends, loaders and the Anthropic SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,anthropic,pdf,docx,hub,chroma,faiss,qdrant]"
      - name: Full test suite (backend tests and the live path run against real Chroma / FAISS / Qdrant)
        run: pytest -n auto

  smoke:
    name: CLI smoke test (mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with no extras, as a first-time user would
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Environment check
        run: ragbench doctor
      - name: Documents to a decision, in one command
        run: |
          ragbench demo
          ragbench auto --docs data/demo/docs --questions data/demo/questions.jsonl --qrels data/demo/qrels.jsonl --preset quick --mock --yes --output-dir smoke_results
      - name: The run directory is complete and the history tools read it
        run: |
          run_dir=$(ls -d smoke_results/*/ | head -n 1)
          test -f "$run_dir/report.html" && test -f "$run_dir/winner.yaml" && test -f "$run_dir/recommendation.json"
          ragbench report "$run_dir"
          ragbench runs --results-dir smoke_results
          ragbench runs index --results-dir smoke_results
          ragbench compare-runs "$run_dir" "$run_dir" --fail-on-regression
      - name: A config run, with the old and the new flags
        run: |
          ragbench inspect-dataset --docs data/demo/docs --questions data/demo/questions.jsonl --qrels data/demo/qrels.jsonl
          ragbench run --config configs/recommended.yaml --mock --max-workers 2 --json > run.json
          python -c "import json; assert json.load(open('run.json'))['status'] == 'complete'"

  build:
    name: Package build
    uses: ./.github/workflows/package.yml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag ragbench:ci .
      - name: It runs as a non-root user and the demo works with no API key
        run: |
          docker run --rm --entrypoint sh ragbench:ci -c 'test "$(id -u)" != 0'
          docker run --rm ragbench:ci --version
          docker run --rm ragbench:ci demo
          # The demo data lives in the container's working directory, so the run that reads it shares a container with the command that writes it.
          docker run --rm --entrypoint sh ragbench:ci -c 'ragbench demo && ragbench run --preset quick --docs data/demo/docs --questions data/demo/questions.jsonl --mock --max-workers 2'

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Findings are worth reading, but a new advisory in a dependency must not block unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[anthropic,pdf,docx]"
          pip-audit --skip-editable
