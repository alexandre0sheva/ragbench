[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.3.0"
description = "Evaluation-first RAG benchmark framework for comparing retrieval and generation strategies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alexandre Sheva", email = "alexandre.sheva@gmail.com" },
]
keywords = ["rag", "retrieval", "evaluation", "benchmark", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.27.3",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "pandas>=3.1",
  # numpy 2.5 needs Python 3.12; 2.4.6 is the last release for 3.11.
  "numpy>=2.5.4; python_version >= '3.12'",
  "numpy>=2.4.6; python_version < '3.12'",
  "scikit-learn>=1.9.1",
  "rank-bm25>=0.2.2",
  "tiktoken>=0.14",
  "openai>=3.37",
  "jinja2>=3.1.6",
  "markdown>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/alexandre0sheva/ragbench"
Repository = "https://github.com/alexandre0sheva/ragbench"
Issues = "https://github.com/alexandre0sheva/ragbench/issues"
Documentation = "https://github.com/alexandre0sheva/ragbench#readme"
Changelog = "https://github.com/alexandre0sheva/ragbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-xdist>=3.8",  # `pytest -n auto`; the slow tests are marked, see CONTRIBUTING.md
  "httpx>=0.28",  # the wire-level tests drive the real OpenAI SDK through httpx.MockTransport; the SDK no longer installs it
  "ruff>=0.17.2",
  "build>=1.6.1",
  "twine>=7",
  "pytest-cov>=7.1",
  "mypy>=2.4",
  "pre-commit>=4.7",
  "types-PyYAML>=6.0.12.20260906",
  "types-Markdown>=3.10.2.20261007",
]
pdf = ["pypdf>=6.21.2"]
docx = ["python-docx>=1.2"]
anthropic = ["anthropic>=2.3"]
# Vector backends (`retrieval.vector_store`); the default, `numpy`, needs none of them.
chroma = ["chromadb>=1.5.9"]
faiss = ["faiss-cpu>=1.15.1"]
qdrant = ["qdrant-client>=1.20"]
# Local embeddings (`local:<hf-model>`).
local = ["sentence-transformers>=6.2"]
# Cross-encoder reranker (`reranker: cross_encoder`); the same library as `local`, listed separately so each use case reads naturally.
rerank = ["sentence-transformers>=6.2"]

[project.scripts]
ragbench = "ragbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragbench = ["py.typed", "reporting/templates/*", "models/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["slow: takes several seconds even in parallel (full parallel runs, the live path); skip with -m 'not slow' for the fast loop, CI runs them on one Python version"]

[tool.coverage.run]
source = ["ragbench"]
omit = ["*/ragbench/cli/__main__.py"]

[tool.coverage.report]
# Enforced in CI (`pytest --cov`). Raise it when coverage rises; never lower it to make a change pass.
fail_under = 90
show_missing = false
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["results", "data/demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["ragbench"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "faiss.*", "qdrant_client.*", "rank_bm25.*", "tiktoken.*"]
ignore_missing_imports = true
