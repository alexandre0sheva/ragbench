# RAGBench by Galileo: cuad (test): pull the data first with `ragbench datasets pull galileo-cuad` (add `--subset 300` for a cheaper run).
# Check the cost before a live run: `ragbench estimate --config configs/galileo_cuad.yaml`.
run:
  name: galileo_cuad
  output_dir: results

dataset:
  documents_path: data/galileo-cuad/docs
  questions_path: data/galileo-cuad/questions.jsonl
  qrels_path: data/galileo-cuad/qrels.jsonl

systems:
  - type: bm25
    name: bm25
    chunker:
      type: word
      chunk_size: 450
      chunk_overlap: 70
    retrieval:
      top_k: 5
    models:
      generator: gpt-6-luna
  - type: hybrid
    name: hybrid
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      bm25_top_k: 20
      vector_top_k: 20
      final_top_k: 5
      rrf_k: 60
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna
  - type: hybrid_rerank
    name: hybrid_rerank
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      bm25_top_k: 20
      vector_top_k: 20
      candidate_top_k: 30
      final_top_k: 5
      rrf_k: 60
      reranker: local_relevance
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

evaluation:
  k_values: [1, 3, 5, 10]
  judge_enabled: true
  judge_model: anthropic:claude-haiku-5-5   # another model family than the generators (self-preference); live: ANTHROPIC_API_KEY + ragbench[anthropic]
  max_questions: null
  max_workers: 4
