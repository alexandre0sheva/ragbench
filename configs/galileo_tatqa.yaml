# RAGBench by Galileo: tatqa (test): pull the data first with `ragbench datasets pull galileo-tatqa` (add `--subset 300` for a cheaper run).
# Check the cost before a live run: `ragbench estimate --config configs/galileo_tatqa.yaml`.
run:
  name: galileo_tatqa
  output_dir: results

dataset:
  documents_path: data/galileo-tatqa/docs
  questions_path: data/galileo-tatqa/questions.jsonl
  qrels_path: data/galileo-tatqa/qrels.jsonl

systems:
  - type: bm25
    name: bm25
    chunker:
      type: word
      chunk_size: 450
      chunk_overlap: 70
    retrieval:
      top_k: 5
    models:
      generator: gpt-6-luna
  - type: hybrid
    name: hybrid
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      bm25_top_k: 20
      vector_top_k: 20
      final_top_k: 5
      rrf_k: 60
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna
  - type: hybrid_rerank
    name: hybrid_rerank
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      bm25_top_k: 20
      vector_top_k: 20
      candidate_top_k: 30
      final_top_k: 5
      rrf_k: 60
      reranker: local_relevance
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

evaluation:
  k_values: [1, 3, 5, 10]
  judge_enabled: true
  judge_model: anthropic:claude-haiku-5-5   # another model family than the generators (self-preference); live: ANTHROPIC_API_KEY + ragbench[anthropic]
  max_questions: null
  max_workers: 4

# Hub corpora can be large (MultiHop-RAG is ~1.4M tokens): indexing one at full concurrency can exceed OpenAI's lowest-tier limit of
# 1M embedding tokens per minute, and the run's retries give up before the minute frees. Raise or drop this on a higher usage tier.
limits:
  tokens_per_minute: 900000
