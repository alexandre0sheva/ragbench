# The bundled hard suite (`ragbench demo --suite hard`, generated by scripts/generate_hard_suite.py): eight systems that span
# the field, from the no-retrieval floor through single-shot retrieval and query decomposition to two agents.
# Their settings are those of configs/all.yaml, except full_context: the corpus (~52k tokens) is past its budget here on
# purpose, so it reads the most BM25-relevant whole documents that fit. Point configs/all.yaml at data/hard to run every system.
# Check the cost before a live run: `ragbench estimate --config configs/hard.yaml` (it said $0.74; the live run of 25 Oct 2026 cost $0.96,
# of which $0.45 was the judge, because agents and long contexts give the judge more to read than the mock does).
run:
  name: hard_suite
  output_dir: results

dataset:
  documents_path: data/hard/docs
  questions_path: data/hard/questions.jsonl
  qrels_path: data/hard/qrels.jsonl

systems:
  - type: no_retrieval
    name: no_retrieval_floor
    models:
      generator: gpt-6-luna

  - type: full_context
    name: full_context_16k
    retrieval:
      context_token_budget: 16000
    models:
      generator: gpt-6-luna

  - type: bm25
    name: bm25_default
    chunker:
      type: word
      chunk_size: 450
      chunk_overlap: 70
    retrieval:
      top_k: 5
    models:
      generator: gpt-6-luna

  - type: vector
    name: vector_default
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      top_k: 5
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

  - type: hybrid_rerank
    name: hybrid_rerank_default
    chunker:
      type: word
      chunk_size: 500
      chunk_overlap: 80
    retrieval:
      vector_store: numpy
      bm25_top_k: 20
      vector_top_k: 20
      candidate_top_k: 30
      final_top_k: 5
      rrf_k: 60
      reranker: local_relevance
      multi_query: true
      max_query_variants: 4
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

  - type: decompose
    name: decompose_default
    chunker:
      type: word
      chunk_size: 250
      chunk_overlap: 40
    retrieval:
      retriever: hybrid
      vector_store: numpy
      max_subquestions: 4
      top_k: 5
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

  - type: iterative
    name: iterative_default
    chunker:
      type: word
      chunk_size: 250
      chunk_overlap: 40
    retrieval:
      retriever: hybrid
      vector_store: numpy
      max_hops: 3
      max_cost_usd: 0.02
      top_k: 5
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

  - type: agent_search
    name: agent_search_tools
    chunker:
      type: word
      chunk_size: 250
      chunk_overlap: 40
    retrieval:
      retriever: hybrid
      vector_store: numpy
      max_steps: 5
      max_cost_usd: 0.05
      top_k: 5
    tools: [calculator, date_calc, corpus_grep]
    models:
      embedding: text-embedding-3-small
      generator: gpt-6-luna

evaluation:
  k_values: [1, 3, 5, 10]
  judge_enabled: true
  judge_model: anthropic:claude-haiku-5-5   # another model family than the generators (self-preference); live: ANTHROPIC_API_KEY + ragbench[anthropic]
  max_questions: null
  max_workers: 4
  max_cost_usd: 1.15   # a live run stops here
