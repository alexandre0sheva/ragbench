# The winner of all_systems_demo_20261001_221453: 'bm25_default'. Run it with `ragbench run --config <this file>`.
# `dataset:` is the benchmark's data; replace it with your production documents before deploying.
run:
  name: all_systems_demo_winner
  output_dir: results
dataset:
  documents_path: data/demo/docs
  questions_path: data/demo/questions.jsonl
  qrels_path: data/demo/qrels.jsonl
systems:
- type: bm25
  name: bm25_default
  chunker:
    type: word
    chunk_size: 450
    chunk_overlap: 70
  retrieval:
    top_k: 5
  models:
    generator: gpt-6-luna
evaluation:
  max_cost_usd: 6
  k_values:
  - 1
  - 3
  - 5
  - 10
  judge_enabled: true
  judge_model: gpt-6-luna
  max_questions: null
  max_workers: 4
