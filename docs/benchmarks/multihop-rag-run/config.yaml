run:
  name: all_solutions_multihop
  output_dir: results
dataset:
  documents_path: data/multihop-rag/docs
  questions_path: data/multihop-rag/questions.jsonl
  qrels_path: data/multihop-rag/qrels.jsonl
systems:
- type: bm25
  name: bm25_default
  chunker:
    type: word
    chunk_size: 450
    chunk_overlap: 70
  retrieval:
    top_k: 5
  models:
    generator: gpt-6-luna
- type: vector
  name: vector_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: hybrid
  name: hybrid_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    bm25_top_k: 20
    vector_top_k: 20
    final_top_k: 5
    rrf_k: 60
    multi_query: true
    max_query_variants: 4
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: rerank
  name: rerank_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    candidate_top_k: 30
    final_top_k: 5
    reranker: local_relevance
    multi_query: true
    max_query_variants: 4
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: hybrid_rerank
  name: hybrid_rerank_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    bm25_top_k: 20
    vector_top_k: 20
    candidate_top_k: 30
    final_top_k: 5
    rrf_k: 60
    reranker: local_relevance
    multi_query: true
    max_query_variants: 4
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: hyde
  name: hyde_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    top_k: 5
    probe_top_k: 10
    fuse_with_question: true
    rrf_k: 60
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: parent_doc
  name: parent_doc_default
  chunker:
    child_chunk_size: 250
    child_chunk_overlap: 50
    parent_chunk_size: 1000
    parent_chunk_overlap: 150
  retrieval:
    vector_store: numpy
    top_k_children: 8
    top_k_parents: 4
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: llm_heavy
  name: llm_heavy_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    top_k: 5
    per_query_top_k: 10
    reranker: local_relevance
  models:
    embedding: text-embedding-3-small
    generator: gpt-6.1-sol
  llm_features:
    enable_llm_ingestion: false
    enable_query_rewrite: true
    enable_llm_rerank: false
- type: no_retrieval
  name: no_retrieval_floor
  models:
    generator: gpt-6-luna
- type: full_context
  name: full_context_50k
  retrieval:
    context_token_budget: 50000
  models:
    generator: gpt-6-luna
- type: sentence_window
  name: sentence_window_default
  retrieval:
    vector_store: numpy
    window: 2
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: vector
  name: vector_mmr
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    top_k: 5
    diversity: mmr
    mmr_lambda: 0.5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: contextual
  name: contextual_default
  chunker:
    type: word
    chunk_size: 450
    chunk_overlap: 70
  retrieval:
    vector_store: numpy
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: hierarchical
  name: hierarchical_default
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    docs_k: 5
    chunks_per_doc: 2
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: raptor
  name: raptor_collapsed
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    mode: collapsed
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: compression
  name: compression_llm_extract
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    vector_store: numpy
    compressor: llm_extract
    candidate_k: 20
    context_token_budget: 1500
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: late_interaction
  name: late_interaction_rerank
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    vector_store: numpy
    mode: rerank
    candidate_k: 30
    final_top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: rag_fusion
  name: rag_fusion_default
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    num_queries: 4
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: decompose
  name: decompose_default
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    max_subquestions: 4
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: corrective
  name: corrective_default
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    max_rounds: 2
    expand_to: hybrid
    max_cost_usd: 0.02
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: iterative
  name: iterative_default
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    max_hops: 3
    max_cost_usd: 0.02
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: agent_search
  name: agent_search_plain
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    max_steps: 5
    max_cost_usd: 0.05
    top_k: 5
  tools: []
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: agent_search
  name: agent_search_tools
  chunker:
    type: word
    chunk_size: 250
    chunk_overlap: 40
  retrieval:
    retriever: hybrid
    vector_store: numpy
    max_steps: 5
    max_cost_usd: 0.05
    top_k: 5
  tools:
  - calculator
  - date_calc
  - corpus_grep
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: grep_agent
  name: grep_agent_default
  retrieval:
    max_steps: 6
    max_cost_usd: 0.05
    top_k: 5
  models:
    generator: gpt-6-luna
- type: adaptive
  name: adaptive_default
  retrieval:
    router: heuristic
    routes:
      default:
        type: hybrid_rerank
        chunker:
          type: word
          chunk_size: 250
          chunk_overlap: 40
        retrieval:
          vector_store: numpy
          final_top_k: 5
      lexical:
        type: bm25
        chunker:
          type: word
          chunk_size: 250
          chunk_overlap: 40
        retrieval:
          top_k: 5
      multi_hop:
        type: decompose
        chunker:
          type: word
          chunk_size: 250
          chunk_overlap: 40
        retrieval:
          retriever: hybrid
          vector_store: numpy
          top_k: 5
      computation:
        type: agent_search
        chunker:
          type: word
          chunk_size: 250
          chunk_overlap: 40
        retrieval:
          retriever: hybrid
          vector_store: numpy
          max_steps: 5
          max_cost_usd: 0.05
          top_k: 5
        tools:
        - calculator
        - date_calc
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: decision_gate
  name: decision_gate_default
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    bm25_top_k: 20
    vector_top_k: 20
    candidate_top_k: 30
    final_top_k: 5
    rrf_k: 60
    reranker: local_relevance
    multi_query: true
    max_query_variants: 4
    decision_model:
      provider: openai_decisions
      model: gpt-6-luna
    judge_mode: batched
    answerability_threshold: 0.5
    sufficiency_threshold: 0.5
    max_candidates_to_judge: 10
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: decision_gate
  name: decision_gate_strict
  chunker:
    type: word
    chunk_size: 500
    chunk_overlap: 80
  retrieval:
    vector_store: numpy
    bm25_top_k: 20
    vector_top_k: 20
    candidate_top_k: 30
    final_top_k: 5
    rrf_k: 60
    reranker: local_relevance
    multi_query: true
    max_query_variants: 4
    decision_model:
      provider: openai_decisions
      model: gpt-6-luna
    judge_mode: batched
    answerability_threshold: 0.5
    sufficiency_threshold: 0.5
    max_candidates_to_judge: 10
    answerability_instructions: Does {passage} state a fact that answers the question,
      or a fact the answer depends on? Passages that are merely about the same domain,
      product line or industry, without such a fact, do not count.
    sufficiency_instructions: 'Is the specific fact the question asks for stated in
      the evidence? Mentioning the same entity or topic is not enough: the evidence
      must give the actual answer to every part of the question.'
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: graph_rag
  name: graph_rag_local
  chunker:
    type: word
    chunk_size: 300
    chunk_overlap: 40
  retrieval:
    mode: local
    top_k: 5
    entities_k: 10
    max_relations: 20
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: graph_rag
  name: graph_rag_global
  chunker:
    type: word
    chunk_size: 300
    chunk_overlap: 40
  retrieval:
    mode: global
    top_k: 5
  models:
    embedding: text-embedding-3-small
    generator: gpt-6-luna
- type: python_callable
  name: langchain_default
  retrieval:
    target: examples/langchain_default.py:answer
    ingest_target: examples/langchain_default.py:ingest
    model: gpt-6-luna
- type: python_callable
  name: llamaindex_default
  retrieval:
    target: examples/llamaindex_default.py:answer
    ingest_target: examples/llamaindex_default.py:ingest
    model: gpt-6-luna
- type: python_callable
  name: haystack_default
  retrieval:
    target: examples/haystack_default.py:answer
    ingest_target: examples/haystack_default.py:ingest
    model: gpt-6-luna
openrouter:
  provider:
    data_collection: deny
evaluation:
  k_values:
  - 1
  - 3
  - 5
  - 10
  judge_enabled: true
  judge:
    panel:
    - anthropic:claude-haiku-5-5
    - gpt-6-luna
    independent: true
    scorers: first
  trials: 1
  max_questions: null
  max_workers: 4
  max_cost_usd: 24.0
limits:
  tokens_per_minute: 900000
